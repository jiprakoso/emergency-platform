asyncapi: 3.1.0
info:
  title: Emergency Platform Realtime
  version: 1.0.0
  description: 'Kontrak WebSocket (Socket.IO namespace /realtime) untuk aplikasi sampel.

    Acuan: docs/specs/websocket-aplikasi-darurat.md §5-6.

    REST adalah satu-satunya jalur tulis; WebSocket hanya mengantar event.

    At-least-once: klien membuang duplikat dengan `eid`.'
  contact:
    name: Emergency Platform
    url: https://github.com/jiprakoso/emergency-platform
  license:
    name: UNLICENSED
  tags:
  - name: incident
    description: Event kejadian (kepada dispatcher dan pihak terkait)
  - name: dispatch
    description: Event penugasan responder
  - name: resource
    description: Event resource request
  - name: report
    description: Event status laporan warga
  - name: alert
    description: Event peringatan bencana
  - name: unit
    description: Event unit dan lokasi
  - name: system
    description: Event sistem dan sesi
  - name: client
    description: Perintah klien -> server (bukan jalur tulis data domain)
defaultContentType: application/json
servers:
  development:
    host: localhost:3000
    pathname: /realtime
    protocol: socketio
    protocolVersion: '4'
    description: Dev (ws, fallback polling)
channels:
  realtime:
    address: /realtime
    title: Realtime
    description: Satu namespace Socket.IO. Server mengatur room; klien tidak join sembarang.
    messages:
      ConnectionReady:
        $ref: '#/components/messages/ConnectionReady'
      AuthExpiring:
        $ref: '#/components/messages/AuthExpiring'
      AuthExpired:
        $ref: '#/components/messages/AuthExpired'
      SessionRevoked:
