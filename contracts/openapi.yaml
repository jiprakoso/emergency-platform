  # ==== 5.5 Incident ====
  /incidents:
    get:
      tags: [incidents]
      summary: Antrean/daftar incident
      operationId: GETIncidents
      description: "Antrean/daftar incident"
      parameters:
        - name: status
          in: query
          schema: { type: string }
          description: Nilai dipisah koma
        - name: typeCode
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/Severity' }
        - name: districtId
          in: query
          schema: { type: string }
        - name: leadOrgId
          in: query
          schema: { type: string, format: uuid }
        - name: lockedBy
          in: query
          schema: { type: string, format: uuid }
        - name: flag
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: q
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: ['-createdAt', '-severity', 'createdAt'] }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Daftar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/IncidentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [incidents]
      summary: Input manual incident (penelepon)
      operationId: POSTIncidents
      description: "Input manual incident (penelepon)"
      x-permission: incident.create_manual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [typeCode, location, description, reporter, channel]
              properties:
                typeCode: { type: string }
                location: { $ref: '#/components/schemas/Coordinates' }
                addressText: { type: string }
                description: { type: string }
                reporter:
                  type: object
                  required: [name, phone]
                  properties:
                    name: { type: string }
                    phone: { type: string }
                channel: { $ref: '#/components/schemas/Channel' }
                severity: { $ref: '#/components/schemas/Severity' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /incidents/{id}:
    get:
      tags: [incidents]
      summary: Detail incident (bentuk sesuai role)
      operationId: GETIncidentsId
      description: "Detail incident (bentuk sesuai role)"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detail (bentuk sesuai role)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        description: DispatcherView / OfferView / UnitView sesuai role
                        oneOf:
                          - $ref: '#/components/schemas/DispatcherViewIncident'
                          - $ref: '#/components/schemas/OfferView'
                          - $ref: '#/components/schemas/UnitView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [incidents]
      summary: Ubah data incident (wajib pegang kunci + version)
      operationId: PATCHIncidentsId
      description: "Ubah data incident (wajib pegang kunci + version)"
      x-permission: incident.update
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
                typeCode: { type: string }
                severity: { $ref: '#/components/schemas/Severity' }
                escalationLevel: { type: integer }
                summary: { type: string }
                location: { $ref: '#/components/schemas/Coordinates' }
                addressText: { type: string }
      responses:
        '200': { description: Berhasil }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /incidents/{id}/lock:
    post:
      tags: [incidents]
      summary: Ambil kunci incident
      operationId: POSTIncidentsIdLock
      description: "Ambil kunci incident"
      x-permission: incident.lock
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean, description: Butuh incident.lock_override }
      responses:
        '200': { description: Kunci diambil }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [incidents]
      summary: Lepas kunci
      operationId: DELETEIncidentsIdLock
      description: "Lepas kunci"
      x-permission: incident.lock
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Berhasil }

