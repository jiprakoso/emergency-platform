  schemas:
    Coordinates:
      type: object
      required:
      - lat
      - lng
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        accuracyM:
          type: number
    EventEnvelope:
      type: object
      required:
      - eid
      - id
      - type
      - v
      - ts
      - class
      - ackRequired
      - data
      properties:
        eid:
          type: string
          format: uuid
          description: Id pengiriman logis (untuk dedup WS/FCM)
        id:
          type:
          - string
          - 'null'
          description: Id incident_events (kursor sync); null untuk event sementara
        type:
          type: string
          description: Nama event (juga nama event Socket.IO)
        v:
          type: integer
          description: Versi skema payload
        ts:
          type: string
          format: date-time
        incidentId:
          type:
          - string
          - 'null'
          format: uuid
        dispatchId:
          type:
          - string
          - 'null'
          format: uuid
        resourceVersion:
          type:
          - integer
          - 'null'
        class:
          type: string
          enum:
          - CRITICAL
          - STANDARD
          - INFO
        ackRequired:
          type: boolean
        data:
          type: object
    ConnectionReadyData:
      type: object
      required:
      - serverTime
      - userId
      - rooms
      - minAppVersion
      - resyncRecommended
      properties:
        serverTime:
          type: string
          format: date-time
        userId:
          type: string
          format: uuid
        rooms:
          type: array
          items:
            type: string
        minAppVersion:
          type: string
        resyncRecommended:
          type: boolean
          const: true
    AuthExpiringData:
      type: object
      required:
      - expiresInSeconds
      properties:
        expiresInSeconds:
          type: integer
    SessionRevokedData:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          enum:
          - LOGOUT
          - ACCOUNT_DEACTIVATED
          - REFRESH_REUSE
          - ADMIN_REVOKED
    SystemNoticeData:
      type: object
      required:
      - level
      - message
      properties:
        level:
          type: string
        message:
          type: string
    IncidentSummaryData:
      type: object
      description: IncidentSummary ringkas (mengikuti REST §4)
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        status:
          type: string
          enum:
          - SUBMITTED
          - VERIFIED
          - IN_PROGRESS
          - RESOLVED
          - CLOSED
          - INVALID
          - DUPLICATE
        type:
          type: object
          properties:
            code:
              type: string
            name:
              type: string
        severity:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        district:
          type: object
          properties:
            code:
              type: string
            name:
              type: string
        village:
          type: object
          properties:
            code:
              type: string
            name:
              type: string
        location:
          $ref: '#/components/schemas/Coordinates'
        reportCount:
          type: integer
        version:
          type: integer
