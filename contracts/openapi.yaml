      summary: Perpanjang kunci (heartbeat)
      operationId: POSTIncidentsIdLockRenew
      description: "Perpanjang kunci (heartbeat)"
      x-permission: incident.lock
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Diperpanjang }
        '409': { $ref: '#/components/responses/Conflict' }

