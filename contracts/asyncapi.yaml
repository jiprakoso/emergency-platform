operations:
  receiveServerEvents:
    action: receive
    channel:
      $ref: '#/channels/realtime'
    summary: Menerima event server -> klien
    description: Server mengirim event satu arah dengan amplop standar (eid, id, type, v, ts, class, ackRequired, data). At-least-once;
      klien membuang duplikat dengan eid dan membalas ack bila ackRequired.
    messages:
    - $ref: '#/channels/realtime/messages/ConnectionReady'
    - $ref: '#/channels/realtime/messages/AuthExpiring'
    - $ref: '#/channels/realtime/messages/AuthExpired'
    - $ref: '#/channels/realtime/messages/SessionRevoked'
    - $ref: '#/channels/realtime/messages/SystemNotice'
    - $ref: '#/channels/realtime/messages/IncidentCreated'
    - $ref: '#/channels/realtime/messages/IncidentReportAdded'
    - $ref: '#/channels/realtime/messages/IncidentUpdated'
    - $ref: '#/channels/realtime/messages/IncidentLocationUpdated'
    - $ref: '#/channels/realtime/messages/IncidentStatusChanged'
    - $ref: '#/channels/realtime/messages/IncidentLocked'
    - $ref: '#/channels/realtime/messages/IncidentUnlocked'
    - $ref: '#/channels/realtime/messages/IncidentLockOverridden'
    - $ref: '#/channels/realtime/messages/IncidentMerged'
    - $ref: '#/channels/realtime/messages/IncidentLeadChanged'
    - $ref: '#/channels/realtime/messages/IncidentCasualtiesUpdated'
    - $ref: '#/channels/realtime/messages/IncidentMilestoneRecorded'
    - $ref: '#/channels/realtime/messages/IncidentNoteAdded'
    - $ref: '#/channels/realtime/messages/DispatchOffered'
    - $ref: '#/channels/realtime/messages/DispatchNotified'
    - $ref: '#/channels/realtime/messages/DispatchCreated'
    - $ref: '#/channels/realtime/messages/DispatchAccepted'
    - $ref: '#/channels/realtime/messages/DispatchRejected'
    - $ref: '#/channels/realtime/messages/DispatchExpired'
    - $ref: '#/channels/realtime/messages/DispatchCancelled'
    - $ref: '#/channels/realtime/messages/DispatchSelfInitiated'
    - $ref: '#/channels/realtime/messages/DispatchStatusChanged'
    - $ref: '#/channels/realtime/messages/DispatchOfferUnseen'
    - $ref: '#/channels/realtime/messages/ResourceRequestCreated'
    - $ref: '#/channels/realtime/messages/ResourceRequestDecided'
    - $ref: '#/channels/realtime/messages/ReportStatusChanged'
    - $ref: '#/channels/realtime/messages/ReportTimelineUpdated'
    - $ref: '#/channels/realtime/messages/AlertPublished'
    - $ref: '#/channels/realtime/messages/AlertUpdated'
    - $ref: '#/channels/realtime/messages/AlertClosed'
    - $ref: '#/channels/realtime/messages/NotificationCreated'
    - $ref: '#/channels/realtime/messages/UnitStatusChanged'
    - $ref: '#/channels/realtime/messages/UnitLocationUpdated'
  sendClientCommands:
    action: send
    channel:
      $ref: '#/channels/realtime'
    summary: Mengirim perintah klien -> server
    description: 'Empat perintah satu-satunya yang dikirim klien ke server: ack, auth.refresh, app.state, unit.location. Semua
      divalidasi DTO, dibatasi laju, dan tidak pernah mengubah data domain (REST tetap satu-satunya jalur tulis).'
    messages:
    - $ref: '#/channels/realtime/messages/AckCommand'
    - $ref: '#/channels/realtime/messages/AuthRefreshCommand'
    - $ref: '#/channels/realtime/messages/AppStateCommand'
    - $ref: '#/channels/realtime/messages/UnitLocationCommand'
