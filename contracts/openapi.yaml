openapi: 3.1.0
info:
  title: Emergency Platform API
  version: 1.0.0
  description: |
    Kontrak REST untuk Aplikasi Informasi Bencana & Kejadian Darurat (sampel).
    Acuan: `docs/specs/rest-api-aplikasi-darurat.md`.
    Perubahan merusak = versi baru di URL (`/api/v2`).
  license:
    name: UNLICENSED
  contact:
    name: Emergency Platform (sampel)
    url: https://example.invalid/emergency-platform
servers:
  - url: /api/v1
    description: Base URL versi 1
tags:
  - name: auth
    description: Autentikasi, sesi, dan akun
  - name: reference
    description: Referensi dan konfigurasi publik
  - name: attachments
    description: Lampiran (alur presigned)
  - name: reports
    description: Laporan warga
  - name: incidents
    description: Kejadian
  - name: dispatches
    description: Penugasan unit
  - name: resource-requests
    description: Permintaan bantuan tambahan
  - name: units
    description: Unit
  - name: alerts
    description: Alert bencana
  - name: notifications
    description: Notifikasi in-app
  - name: shifts
    description: Shift dispatcher
  - name: dashboard
    description: Ringkasan dashboard
  - name: admin
    description: Administrasi organisasi, staf, role, pengaturan, audit
  - name: sync
    description: Sinkronisasi (pendukung reconnect)
  - name: health
    description: Kesehatan
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
    cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Kunci idempotensi untuk aksi status (disimpan 24 jam).
      schema: { type: string, format: uuid }

  schemas:
    Coordinates:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        accuracyM: { type: number, format: double, description: Akurasi meter }

    Envelope:
      type: object
      required: [data]
      properties:
        data: { type: object }

    PageInfo:
      type: object
      required: [hasMore]
      properties:
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }

    PageEnvelope:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { type: object } }
        page: { $ref: '#/components/schemas/PageInfo' }

    ErrorDetail:
      type: object
      properties:
        field: { type: string }
        issue: { type: string }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          allOf:
            - $ref: '#/components/schemas/ErrorCode'
          description: Kode stabil bahasa Inggris
        message: { type: string, description: Pesan bahasa Indonesia }
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }
        requestId: { type: string }
        currentVersion:
          type: [integer, 'null']
          description: Disertakan pada VERSION_CONFLICT

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }

    ErrorCode:
      type: string
      description: Katalog kode galat (REST §7)
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - REFRESH_TOKEN_REUSED
        - OTP_INVALID
        - OTP_EXPIRED
        - TWO_FACTOR_REQUIRED
        - FORBIDDEN
        - NOT_LEAD_ORGANIZATION
        - ACCOUNT_DEACTIVATED
        - NOT_FOUND
        - VERSION_CONFLICT
        - INCIDENT_LOCKED
        - LOCK_REQUIRED
        - INVALID_STATUS_TRANSITION
        - INCIDENT_NOT_DISPATCHABLE
        - ACTIVE_DISPATCHES_EXIST
        - UNIT_NOT_AVAILABLE
        - OFFER_NO_LONGER_AVAILABLE
        - DISPATCH_ALREADY_ACCEPTED
        - RESOURCE_REQUEST_ALREADY_DECIDED
        - ATTACHMENT_EXPIRED
        - REPORT_KIND_NOT_ALLOWED
        - IDEMPOTENCY_CONFLICT
        - ATTACHMENT_INVALID
        - OCCURRED_AT_OUT_OF_RANGE
        - RATE_LIMITED
        - OTP_TOO_MANY_ATTEMPTS
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR

    # ---- Enum domain (nilai tak dikenal ditoleransi klien) ----
    IncidentStatus:
      type: string
      enum:
        - SUBMITTED
        - VERIFIED
        - IN_PROGRESS
        - RESOLVED
        - CLOSED
        - INVALID
        - DUPLICATE

    PublicStatus:
      type: string
      enum:
        - RECEIVED
        - VERIFIED
        - UNIT_DISPATCHED
        - UNIT_EN_ROUTE
        - UNIT_ON_SCENE
        - RESOLVED
        - NOT_VALID
        - OUT_OF_AREA

    DispatchStatus:
      type: string
      enum:
        - OFFERED
        - ACCEPTED
        - EN_ROUTE
        - ON_SCENE
        - DONE
        - REJECTED
        - EXPIRED
        - CANCELLED
        - NOTIFIED
        - READY
        - FULL
        - PATIENT_ARRIVED

    DispatchType:
      type: string
      enum: [RESPOND, NOTIFY]

    DispatchOrigin:
      type: string
      enum: [DISPATCHER, SELF_INITIATED, REQUESTED]

    Severity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    ReportKind:
      type: string
      enum: [HELP_REQUEST, CONDITION_REPORT]

    ReportStatus:
      type: string
      enum: [NEW, REVIEWED, LINKED, WITHDRAWN]

    Channel:
      type: string
      enum: [PHONE, WHATSAPP, SMS]

    UnitStatus:
      type: string
      enum: [AVAILABLE, BUSY, OFFLINE, OUT_OF_SERVICE]

    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, DEACTIVATED]

    AlertLevel:
      type: string
      description: Konfigurabel (system_settings.alert_levels)
      enum: [INFO, WARNING, ALERT, EMERGENCY]

    AlertStatus:
      type: string
      enum: [DRAFT, ACTIVE, CLOSED]

    DeliveryMode:
      type: string
      enum: [REGION_TOPIC, GEOFENCE]

    Urgency:
      type: string
      enum: [NORMAL, URGENT]

    VictimHint:
      type: string
      enum: [NONE, ONE, TWO, THREE_OR_MORE, MANY, UNKNOWN]

    NoteVisibility:
      type: string
      enum: [INTERNAL, LEAD, UNITS]

    RegionLevel:
      type: string
      enum: [PROVINCE, DISTRICT, VILLAGE]

    OrganizationType:
      type: string
      enum: [POLICE, FIRE, AMBULANCE, BPBD, HOSPITAL, OTHER]

    MilestoneCode:
      type: string
      enum:
        - SCENE_RELEASED
        - ROAD_REOPENED
        - VICTIM_DECEASED_HANDLED
        - EXTERNAL_UNIT_ARRIVED
        - EXTERNAL_COORDINATION

    OutcomeCode:
      type: string
      enum:
        - COMPLETED
        - NOT_FOUND
        - HANDED_OVER
        - PATIENT_TRANSPORTED
        - FALSE_ALARM

    # ---- Objek referensi ringkas ----
    RegionRef:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }

    IncidentTypeRef:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }

    IncidentRef:
      type: object
      required: [id, code]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: INC-20261005-000123 }

    OrganizationRef:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/OrganizationType' }

    UnitRef:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/UnitStatus' }

    DeviceInfo:
      type: object
      required: [platform, appFlavor, appVersion]
      properties:
        platform: { type: string, enum: [ANDROID, IOS, WEB] }
        appFlavor: { type: string, enum: [CITIZEN, STAFF] }
        appVersion: { type: string, example: 1.0.0 }
        fcmToken: { type: string }
        pushEnabled: { type: boolean, default: true }

    # ---- Token ----
    TokenPair:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        accessTokenExpiresIn: { type: integer, example: 900 }
        refreshToken: { type: string }
        refreshTokenExpiresIn: { type: integer, example: 2592000 }
        user:
          type: object
          required: [id, userType]
          properties:
            id: { type: string, format: uuid }
            userType: { type: string, enum: [CITIZEN, STAFF] }
            fullName: { type: string }
            roles: { type: array, items: { type: string } }

    # ---- Views ----
    DispatchSummary:
      type: object
      description: Ringkasan dispatch per incident untuk dashboard
      properties:
        active: { type: integer }
        offered: { type: integer }
        rejected: { type: integer }
        expired: { type: integer }
        byOrganization:
          type: array
          items:
            type: object
            properties:
              organization: { $ref: '#/components/schemas/OrganizationRef' }
              active: { type: integer }

    IncidentSummary:
      type: object
      description: Item daftar incident (DispatcherView ringkas)
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        type: { $ref: '#/components/schemas/IncidentTypeRef' }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        severity: { $ref: '#/components/schemas/Severity' }
        district: { $ref: '#/components/schemas/RegionRef' }
        village: { $ref: '#/components/schemas/RegionRef' }
        leadOrganization: { $ref: '#/components/schemas/OrganizationRef' }
        createdAt: { type: string, format: date-time }
        dispatchSummary: { $ref: '#/components/schemas/DispatchSummary' }
        attentionReasons:
          type: array
          items:
            type: string
            enum:
              - NEEDS_REPLACEMENT
              - SUGGESTED_DUPLICATE
              - UNSEEN_OFFER
              - PENDING_RESOURCE_REQUEST

    OfferIncident:
      type: object
      description: Data incident pada OfferView (tanpa lokasi presisi)
      properties:
        code: { type: string }
        type: { $ref: '#/components/schemas/IncidentTypeRef' }
        severity: { $ref: '#/components/schemas/Severity' }
        district: { $ref: '#/components/schemas/RegionRef' }
        village: { $ref: '#/components/schemas/RegionRef' }
        distanceM: { type: integer }

    OfferView:
      type: object
      description: Tampilan responder SEBELUM accept (tanpa lokasi presisi/kontak)
      required: [dispatchId, incident, type, origin, status]
      properties:
        dispatchId: { type: string, format: uuid }
        incident: { $ref: '#/components/schemas/OfferIncident' }
        type: { $ref: '#/components/schemas/DispatchType' }
        origin: { $ref: '#/components/schemas/DispatchOrigin' }
        status: { $ref: '#/components/schemas/DispatchStatus' }
        offerExpiresAt: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'] }

    CasualtySnapshot:
      type: object
      properties:
        injured: { type: integer }
        deceased: { type: integer }
        critical: { type: [integer, 'null'] }
        missing: { type: [integer, 'null'] }

    AttachmentRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        mimeType: { type: string }
        kind: { type: string, enum: [IMAGE, VIDEO, DOCUMENT] }

    DispatchUnitSummary:
      type: object
      description: Ringkasan dispatch unit lain (UnitView)
      properties:
        organization: { $ref: '#/components/schemas/OrganizationRef' }
        unit: { $ref: '#/components/schemas/UnitRef' }
        status: { $ref: '#/components/schemas/DispatchStatus' }
        type: { $ref: '#/components/schemas/DispatchType' }

    UnitViewIncident:
      type: object
      description: Data incident pada UnitView (SESUDAH accept — lokasi presisi ada)
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        type: { $ref: '#/components/schemas/IncidentTypeRef' }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        publicStatus: { $ref: '#/components/schemas/PublicStatus' }
        severity: { $ref: '#/components/schemas/Severity' }
        escalationLevel: { type: [integer, 'null'] }
        district: { $ref: '#/components/schemas/RegionRef' }
        village: { $ref: '#/components/schemas/RegionRef' }
        distanceM: { type: [integer, 'null'] }
        location: { $ref: '#/components/schemas/Coordinates' }
        addressText: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AttachmentRef' }
        casualties: { $ref: '#/components/schemas/CasualtySnapshot' }
        otherDispatches:
          type: array
          items: { $ref: '#/components/schemas/DispatchUnitSummary' }

    UnitView:
      type: object
      description: Tampilan responder SESUDAH accept (lokasi presisi terbuka)
      required: [dispatchId, incident, type, origin, status]
      properties:
        dispatchId: { type: string, format: uuid }
        incident: { $ref: '#/components/schemas/UnitViewIncident' }
        type: { $ref: '#/components/schemas/DispatchType' }
        origin: { $ref: '#/components/schemas/DispatchOrigin' }
        status: { $ref: '#/components/schemas/DispatchStatus' }
        offerExpiresAt: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'] }
        etaMinutes: { type: [integer, 'null'] }
        destinationOrganization: { $ref: '#/components/schemas/OrganizationRef' }

    CitizenReportView:
      type: object
      description: Tampilan warga untuk laporan miliknya sendiri
      properties:
        id: { type: string, format: uuid }
        reportKind: { $ref: '#/components/schemas/ReportKind' }
        status: { $ref: '#/components/schemas/ReportStatus' }
        incident: { $ref: '#/components/schemas/IncidentRef' }
        publicStatus: { $ref: '#/components/schemas/PublicStatus' }
        location: { $ref: '#/components/schemas/Coordinates' }
        addressText: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        flags:
          type: array
          items: { type: string, enum: [OUT_OF_AREA] }
        operatingNow: { type: boolean }
        createdAt: { type: string, format: date-time }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AttachmentRef' }
        emergencyContacts:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              phone: { type: string }

    ReporterMasked:
      type: object
      description: Kontak pelapor DIMASK (hanya DispatcherView yang melihat penuh)
      properties:
        name: { type: [string, 'null'] }
        phoneMasked: { type: [string, 'null'], example: 0812****789 }

    DispatcherViewIncident:
      type: object
      description: Data incident untuk dispatcher/supervisor (paling lengkap)
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        type: { $ref: '#/components/schemas/IncidentTypeRef' }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        publicStatus: { $ref: '#/components/schemas/PublicStatus' }
        severity: { $ref: '#/components/schemas/Severity' }
        escalationLevel: { type: [integer, 'null'] }
        district: { $ref: '#/components/schemas/RegionRef' }
        village: { $ref: '#/components/schemas/RegionRef' }
        location: { $ref: '#/components/schemas/Coordinates' }
        addressText: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }
        leadOrganization: { $ref: '#/components/schemas/OrganizationRef' }
        reporter: { $ref: '#/components/schemas/ReporterMasked' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AttachmentRef' }
        casualties: { $ref: '#/components/schemas/CasualtySnapshot' }
        dispatches:
          type: array
          items: { $ref: '#/components/schemas/DispatchUnitSummary' }
        lockedBy: { type: [string, 'null'], format: uuid }
        lockedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

  responses:
    Unauthorized:
      description: 401 — Token tidak ada/kedaluwarsa
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: 403 — Tidak punya permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 404 — Resource tidak ada atau tidak boleh dilihat
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: 409 — Konflik (lock, version, transisi, balapan)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unprocessable:
      description: 422 — Isi tidak valid secara semantik
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: 429 — Terlalu sering
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationFailed:
      description: 400 — Validasi DTO gagal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

paths:
  # ==== 5.1 Autentikasi dan akun ====
  /auth/otp/request:
    post:
      tags: [auth]
      summary: Minta OTP
      operationId: POSTAuthOtpRequest
      description: "Minta OTP"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, purpose]
              properties:
                phone: { type: string }
                purpose: { type: string, enum: [REGISTER, LOGIN] }
      responses:
        '202':
          description: OTP terkirim
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiresInSeconds: { type: integer }
                  resendAfterSeconds: { type: integer }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/citizen/register:
    post:
      tags: [auth]
      summary: Registrasi warga baru
      operationId: POSTAuthCitizenRegister
      description: "Registrasi warga baru"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otpCode, fullName, device]
              properties:
                phone: { type: string }
                otpCode: { type: string }
                fullName: { type: string }
                homeLocation: { $ref: '#/components/schemas/Coordinates' }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '201':
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/citizen/login:
    post:
      tags: [auth]
      summary: Login warga dengan OTP
      operationId: POSTAuthCitizenLogin
      description: "Login warga dengan OTP"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otpCode, device]
              properties:
                phone: { type: string }
                otpCode: { type: string }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/staff/login:
    post:
      tags: [auth]
      summary: Login staf (mungkin perlu 2FA)
      operationId: POSTAuthStaffLogin
      description: "Login staf (mungkin perlu 2FA)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password, device]
              properties:
                identifier: { type: string, description: Nomor HP atau email }
                password: { type: string }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '200':
          description: Login berhasil ATAU perlu 2FA
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/TokenPair'
                          - type: object
                            properties:
                              twoFactorRequired: { type: boolean, const: true }
                              challengeToken: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/staff/login/2fa:
    post:
      tags: [auth]
      summary: Selesaikan login staf dengan kode TOTP
      operationId: POSTAuthStaffLogin2fa
      description: "Selesaikan login staf dengan kode TOTP"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken: { type: string }
                code: { type: string }
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh token (rotasi)
      operationId: POSTAuthRefresh
      description: "Refresh token (rotasi)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Token baru (rotasi)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Cabut sesi saat ini
      operationId: POSTAuthLogout
      description: "Cabut sesi saat ini"
      responses:
        '204': { description: Berhasil }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/sessions:
    get:
      tags: [auth]
      summary: Daftar sesi aktif sendiri
      operationId: GETAuthSessions
      description: "Daftar sesi aktif sendiri"
      responses:
        '200':
          description: Daftar sesi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/sessions/{id}:
    delete:
      tags: [auth]
      summary: Cabut sesi tertentu
      operationId: DELETEAuthSessionsId
      description: "Cabut sesi tertentu"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Berhasil }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/password/change:
    post:
      tags: [auth]
