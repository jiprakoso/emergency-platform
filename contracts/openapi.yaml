    post:
      tags: [incidents]
      summary: SUBMITTED → VERIFIED
      operationId: POSTIncidentsIdVerify
      description: "SUBMITTED → VERIFIED"
      x-permission: incident.verify
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, severity]
              properties:
                version: { type: integer }
                severity: { $ref: '#/components/schemas/Severity' }
                leadOrganizationId: { type: [string, 'null'], format: uuid }
                summary: { type: string }
      responses:
        '200': { description: Berhasil }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /incidents/{id}/invalidate:
    post:
      tags: [incidents]
      summary: → INVALID
      operationId: POSTIncidentsIdInvalidate
      description: "→ INVALID"
      x-permission: incident.invalidate
      x-audit: incident.invalidate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                version: { type: integer }
                reason: { type: string }
      responses:
        '200': { description: Berhasil }
        '409': { $ref: '#/components/responses/Conflict' }

  /incidents/{id}/merge:
    post:
      tags: [incidents]
      summary: → DUPLICATE dari targetIncidentId
      operationId: POSTIncidentsIdMerge
      description: "→ DUPLICATE dari targetIncidentId"
      x-permission: incident.merge
      x-audit: incident.merge
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, targetIncidentId]
